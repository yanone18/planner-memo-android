<html lang="ja">
<head>

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#243247}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f5f8}
body{overflow:hidden}
button,input,textarea{font:inherit}
.app{max-width:650px;width:100%;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.top{position:relative;z-index:5;flex:none;background:#fff;color:#243247;padding:7px 10px 0;border-bottom:1px solid #e7ebf0;padding-top:max(7px,env(safe-area-inset-top))}
.brand{text-align:center;font-size:10px;letter-spacing:.2em;margin:0 0 5px;color:#758397}
.tabs{display:flex;gap:4px;background:#e9edf3;border-radius:12px;padding:4px}
.tab{flex:1;min-width:0;padding:9px 2px;background:transparent;border:0;border-radius:9px;color:#65758a;font-weight:600;font-size:14px;touch-action:pan-y}
.tab.active{background:#1760a8;color:#fff;box-shadow:0 1px 4px #17446b33}
.tab.reorder-source{background:#edf4ff;color:#294f83;border-radius:8px}.tab.reorder-target{outline:2px dashed #8aa8cf;outline-offset:-3px;border-radius:8px}
.toolbar{flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 12px 5px;background:#fff;min-height:26px}
.toolbar span{font-size:11px;color:#758397}
.menu{border:0;background:transparent;font-size:21px;color:#315f97;padding:0 3px;line-height:1.2}
.note{flex:none;padding:6px 12px;background:#f7f9fc;font-size:11px;color:#60718a;border-bottom:1px solid #e5ebf2}
.sheet{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:#fff;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.transition-in-right{animation:slideFromRight .22s ease-out}
.sheet.transition-in-left{animation:slideFromLeft .22s ease-out}
@keyframes slideFromRight{from{transform:translateX(28px);opacity:.65}to{transform:translateX(0);opacity:1}}
@keyframes slideFromLeft{from{transform:translateX(-28px);opacity:.65}to{transform:translateX(0);opacity:1}}
.dayrow{height:38px;min-height:38px;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid #edf0f4}
.dayrow.rest{background:#fff9df}
.date{width:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:flex-end;padding:0 4px 0 10px;text-align:right;font-size:16px;white-space:nowrap;user-select:none;color:#526175;border:0}
.month-header{position:sticky;top:0;z-index:3;min-height:31px;display:flex;align-items:center;padding:5px 10px;background:#fff;border-bottom:1px solid #edf0f4;color:#526175;font-size:16px;font-weight:500}
.date.sat,.task-date.sat{color:#1769bd}
.date.sun,.task-date.sun{color:#c03d4a}
.entry{flex:1;min-width:0;display:flex;align-items:center;padding:1px 9px 1px 2px;position:relative}
.entry input,.taskrow input{width:100%;min-width:0;background:transparent;border:0;outline:0;font-size:17px;color:#243247;padding:5px 2px;border-radius:0}
.entry input:not(:focus){-webkit-user-select:none;user-select:none}
.entry input:focus{-webkit-user-select:text;user-select:text}
.entry input:focus,.taskrow input:focus{background:transparent}
.color-button{display:none;flex:none;width:32px;height:32px;padding:4px;border:0;background:transparent;color:#315f97;font-size:24px;align-items:center;justify-content:center}
.entry:focus-within .color-button{display:flex}
.template-button{display:none;flex:none;width:32px;height:32px;padding:3px;border:0;background:transparent;font-size:23px;align-items:center;justify-content:center}
.entry:focus-within .template-button{display:flex}
.template-item{display:flex;gap:6px;align-items:center;margin:6px 0}.template-item button:first-child{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis}.template-item button:last-child{flex:none}
.template-text{width:100%;min-height:70px;max-height:140px;resize:vertical;border:1px solid #d9e0e8;border-radius:8px;padding:9px;font-size:16px}.template-actions{display:flex;gap:8px;margin-top:12px}.template-actions button{flex:1}
 .entry .event-display{position:absolute;left:4px;right:78px;top:0;bottom:0;display:flex;align-items:center;gap:0;white-space:pre;overflow:hidden;pointer-events:none;font-size:17px;color:#243247}
.entry .event-display .event-chip{font-size:15px;line-height:22px;padding:0 3px;border-radius:3px;flex:none}
.entry .event-display .event-plain{flex:none}
.entry:not(:focus-within) input{color:transparent!important;caret-color:transparent}
.entry:focus-within .event-display{display:none}
.entry:focus-within input{color:#243247!important}

.color-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.color-swatch{height:42px;border:2px solid transparent;border-radius:6px;position:relative;font-size:10px;white-space:nowrap;padding:2px 1px;letter-spacing:-.3px}
.color-swatch.selected{outline:2px solid #315f97;outline-offset:2px}
.color-text-choice{display:flex;gap:10px;margin:10px 0}
.color-text-choice button{flex:1}
.memo{padding:12px 15px 25px;background:#fff;display:flex;flex-direction:column;min-height:100%}
.memo textarea{display:block;flex:none;width:100%;height:auto;min-height:260px;resize:none;overflow:hidden;border:0;outline:0;background:#fff;font:17px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;color:#243247;caret-color:#315f97;touch-action:auto}
.today{position:fixed;z-index:4;right:max(16px,calc((100vw - 650px)/2 + 16px));bottom:max(18px,env(safe-area-inset-bottom));border:0;border-radius:50%;width:46px;height:46px;background:#315f97;color:white;font-size:23px;box-shadow:0 3px 12px #263e6229}
.hidden{display:none!important}
.trashview{padding:14px}
.trashitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5eaf0}
.trashitem button{padding:8px 12px}
.dialog-backdrop{position:fixed;inset:0;z-index:20;background:#17243b66;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{width:min(100%,360px);background:white;border-radius:14px;padding:18px;box-shadow:0 12px 40px #17243b33}
.dialog h2{font-size:17px;margin:0 0 8px}
.dialog p{font-size:13px;line-height:1.6;color:#64748b}
.dialog button{border:1px solid #d9e0e8;background:#fff;border-radius:9px;padding:10px 12px}
.dialog .primary{background:#315f97;color:white;border-color:#315f97}
.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dialog-actions button{flex:1;min-width:100px}
</style>
</head>
<body>
<div class="app">
<header class="top"><nav class="tabs" id="tabs" aria-label="画面切り替え"></nav></header>
<div class="toolbar"><button class="menu" id="menu" aria-label="メニュー">⋯</button></div>
<main class="sheet" id="sheet"></main>
<input id="restore-file" type="file" accept=".json,application/json" hidden>
</div>
<button id="today" class="today hidden" aria-label="今日に戻る">↑</button>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekday=['日','月','火','水','木','金','土'];
const label=d=>`${d.getDate()}日(${weekday[d.getDay()]})`;
const monthLabel=d=>`${d.getFullYear()}年${d.getMonth()+1}月`;
const color=d=>d.getDay()===0?'sun':d.getDay()===6?'sat':'';
const h=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
const storageKey='planner-schedule-memo-v1';
let state;try{state=JSON.parse(localStorage.getItem(storageKey))}catch{}
state=Object.assign({order:['予定表','メモ'],schedule:{},rest:{},memo:'',trash:[],repeats:[],repeatExceptions:{},eventColors:{}},state||{});
state.order=['予定表','メモ'];
state.repeats=Array.isArray(state.repeats)?state.repeats:[];
state.repeatExceptions=state.repeatExceptions||{};state.eventColors=state.eventColors||{};
// Convert previously configured repeats to ordinary dated entries once; never discard existing events.
if(state.repeats.length){
 const now=today(),until=new Date(now.getFullYear()+5,now.getMonth(),now.getDate());
 for(const rule of state.repeats){
  const step=({months1:1,months3:3,months6:6,yearly:12})[rule.freq];
  if(!step||!/^\\d{4}-\\d{2}-\\d{2}$/.test(rule.start))continue;
  const start=new Date(rule.start+'T12:00:00');
  for(let n=0;n<720;n+=step){
   const target=new Date(start.getFullYear(),start.getMonth()+n,1,12);
   target.setDate(Math.min(start.getDate(),new Date(target.getFullYear(),target.getMonth()+1,0).getDate()));
   if(target>until)break;
   const key=iso(target);
   if(key===rule.start||target<now)continue;
   const exKey=rule.uid+'|'+key;
   const text=Object.prototype.hasOwnProperty.call(state.repeatExceptions,exKey)?state.repeatExceptions[exKey]:rule.text;
   if(text&&!String(state.schedule[key]||'').includes(text))state.schedule[key]=(state.schedule[key]||'')+text;
  }
 }
 state.repeats=[];state.repeatExceptions={};
 localStorage.setItem(storageKey,JSON.stringify(state));
}
let current='予定表',editing=false,active=null,scrolls={},transitionDirection=1;
const save=()=>{localStorage.setItem(storageKey,JSON.stringify(state));try{Android.onStateChanged(JSON.stringify(state))}catch(e){}};
setTimeout(()=>{try{Android.onStateChanged(JSON.stringify(state))}catch(e){}},600);
 const splitEvents=text=>{
  const parts=[];let current='';
  const segments=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(text)].map(x=>x.segment):Array.from(text);
  const isEmoji=x=>/\p{Extended_Pictographic}|[0-9#*]\uFE0F?\u20E3/u.test(x);
  for(const piece of segments){if(isEmoji(piece)&&current.trim()){parts.push(current.trim());current=piece}else current+=piece}
  if(current.trim())parts.push(current.trim());return parts;
 };
 const freqLabel={months1:'1か月ごと',months3:'3か月ごと',months6:'6か月ごと',yearly:'1年ごと'};
 const intervalOf=f=>({months1:1,months3:3,months6:6,yearly:12})[f];
 const addMonths=(start,n)=>{const d=new Date(start+'T12:00:00');const target=new Date(d.getFullYear(),d.getMonth()+n,1,12);target.setDate(Math.min(d.getDate(),new Date(target.getFullYear(),target.getMonth()+1,0).getDate()));return iso(target)};
 const occurrence=(r,id)=>{if(id<r.start)return false;const a=new Date(r.start+'T12:00:00'),b=new Date(id+'T12:00:00');const months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();return months>=0&&months%intervalOf(r.freq)===0&&addMonths(r.start,months)===id};
 const repeatEvents=id=>state.repeats.filter(r=>occurrence(r,id)).map(r=>({rule:r,text:Object.prototype.hasOwnProperty.call(state.repeatExceptions,`${r.uid}|${id}`)?state.repeatExceptions[`${r.uid}|${id}`]:r.text})).filter(x=>x.text);
 const scheduleValue=id=>state.schedule[id]||'';
 const ruleFor=(id,text)=>state.repeats.find(r=>occurrence(r,id)&&(state.repeatExceptions[`${r.uid}|${id}`]??r.text)===text);
 // Repeated occurrences are identified by rule UID, never by edited text.
 const emojiHead=text=>{const s=splitEvents(text);const m=s[0]?.match(/^(?:\p{Extended_Pictographic}|[0-9#*]\uFE0F?\u20E3)/u);return m?.[0]||''};
 const replaceOriginal=(r,text)=>{const parts=splitEvents(state.schedule[r.start]||'');const at=parts.indexOf(r.text);if(at>=0){if(text)parts[at]=text;else parts.splice(at,1);state.schedule[r.start]=parts.join('');}};
 const updateAll=(r,text)=>{replaceOriginal(r,text);r.text=text;Object.keys(state.repeatExceptions).filter(k=>k.startsWith(r.uid+'|')).forEach(k=>delete state.repeatExceptions[k]);};
 // Match an occurrence to the edited segment by its position and leading emoji.
 // The rule UID stays stable even if the text changes or is deleted.
 const reconcileSchedule=(id,beforeText,afterText)=>{
  const before=splitEvents(beforeText),after=splitEvents(afterText);
  const refs=state.repeats.filter(r=>occurrence(r,id)).map(r=>({r,text:state.repeatExceptions[`${r.uid}|${id}`]??r.text})).filter(x=>x.text);
  if(!refs.length){state.schedule[id]=afterText;save();return false;}
  const usedBefore=new Set(),usedAfter=new Set(),edits=[];
  const candidates=refs.map(ref=>{
   let index=before.findIndex((v,i)=>!usedBefore.has(i)&&v===ref.text);
   if(index<0)index=before.findIndex((v,i)=>!usedBefore.has(i)&&emojiHead(v)&&emojiHead(v)===emojiHead(ref.text));
   if(index>=0)usedBefore.add(index);
   return {...ref,index};
  });
  for(const item of candidates){
   let index=-1;
   if(item.index>=0&&item.index<after.length&&!usedAfter.has(item.index)){
    const candidate=after[item.index];
    if(candidate===item.text||(emojiHead(item.text)&&emojiHead(candidate)===emojiHead(item.text)))index=item.index;
   }
   if(index<0)index=after.findIndex((v,i)=>!usedAfter.has(i)&&v===item.text);
   if(index<0&&emojiHead(item.text))index=after.findIndex((v,i)=>!usedAfter.has(i)&&emojiHead(v)===emojiHead(item.text));
   if(index<0&&item.index>=0&&after.length===before.length&&item.index<after.length&&!usedAfter.has(item.index))index=item.index;
   if(index>=0)usedAfter.add(index);
   const value=index<0?'':after[index];
   if(value!==item.text)edits.push({r:item.r,old:item.text,value});
  }
  // Everything not associated with a recurring rule is an ordinary entry.
  const ordinary=after.filter((_,i)=>!usedAfter.has(i)).join('');
  const applyOrdinary=()=>{if(ordinary)state.schedule[id]=ordinary;else delete state.schedule[id];};
  // Original-day text is stored as an ordinary entry for legacy compatibility.
  // Keep that original until a change is explicitly confirmed.
  const applyOriginalSafe=()=>{
   if(candidates.some(x=>x.r.start===id)){
    const original=candidates.filter(x=>x.r.start===id).map(x=>x.text);
    state.schedule[id]=ordinary+original.join('');
   }else applyOrdinary();
  };
  if(!edits.length){applyOriginalSafe();save();return false;}
  if(edits.length>1){showDialog('編集内容を確認','繰り返し予定は一度に1件ずつ変更してください。今回は保存せず元に戻します。',[{label:'閉じる',action:()=>render(true)}]);return true;}
  const change=edits[0];
  showDialog('繰り返し予定の編集',`「${change.old}」を「${change.value||'（削除）'}」に変更します。変更する範囲を選んでください。`,[
   {label:'この予定だけ',action:()=>{
    applyOrdinary();
    if(change.r.start===id){ // On the first day, the original must follow the exception too.
     state.schedule[id]=(state.schedule[id]||'')+change.value;
    }
    state.repeatExceptions[`${change.r.uid}|${id}`]=change.value;
    save();render(true);
   }},
   {label:'すべてに反映',action:()=>{
    applyOrdinary();
    // updateAll replaces the original text; restore the original day explicitly.
    if(change.r.start===id)state.schedule[id]=(state.schedule[id]||'')+change.value;
    else replaceOriginal(change.r,change.value);
    change.r.text=change.value;
    Object.keys(state.repeatExceptions).filter(k=>k.startsWith(change.r.uid+'|')).forEach(k=>delete state.repeatExceptions[k]);
    save();render(true);
   }},
   {label:'キャンセル',action:()=>render(true)}
  ]);
  return true;
 };
 const repeatDialog=(id)=>{const items=splitEvents(scheduleValue(id));if(!items.length){showDialog('繰り返し設定','先に予定を入力してください。',[{label:'閉じる'}]);return;}
  const choose=text=>{const r=ruleFor(id,text);const box=h('div','dialog-backdrop'),panel=h('div','dialog');panel.append(h('h2','','繰り返し設定'),h('p','',`対象：${text} ／ 現在：${r?freqLabel[r.freq]:'繰り返しなし'}`));
   const select=h('select');select.style.cssText='width:100%;padding:12px;border:1px solid #d9e0e8;border-radius:9px;background:white;font:inherit';[['','繰り返しなし'],...Object.entries(freqLabel)].forEach(([v,l])=>{const o=h('option','',l);o.value=v;select.append(o)});select.value=r?.freq||'';panel.append(select);
   const actions=h('div','dialog-actions');const btn=(name,fn,primary=false)=>{const b=h('button',primary?'primary':'',name);b.onclick=fn;actions.append(b)};
   btn('キャンセル',()=>box.remove());btn('決定',()=>{const f=select.value;box.remove();if(!f){if(r)askRemove(r);return;}if(r){r.freq=f}else{state.repeats.push({uid:'r'+Date.now()+Math.random().toString(36).slice(2),start:id,text,freq:f});}save();render(true)},true);
   if(r)btn('繰り返し解除',()=>{box.remove();askRemove(r)});
   panel.append(actions);box.append(panel);document.body.append(box);
  };
  if(items.length===1)return choose(items[0]);showDialog('対象の予定を選択','繰り返し設定する項目を選んでください。',[...items.map(text=>({label:text,action:()=>choose(text)})),{label:'キャンセル'}]);
 };
 const askRemove=r=>showDialog('繰り返し解除','自動生成された予定をどうしますか？',[{label:'予定も削除',action:()=>removeRule(r,false)},{label:'予定を残す',action:()=>removeRule(r,true)},{label:'キャンセル'}]);
 const removeRule=(r,keep)=>{if(keep){const a=new Date(r.start+'T12:00:00');for(let n=0;n<=72;n+=intervalOf(r.freq)){const id=addMonths(r.start,n);const d=new Date(id+'T12:00:00');if(d>new Date(today().getFullYear()+5,today().getMonth(),today().getDate()))break;if(id===r.start)continue;const v=state.repeatExceptions[`${r.uid}|${id}`]??r.text;if(v)state.schedule[id]=(state.schedule[id]||'')+v;}}state.repeats=state.repeats.filter(x=>x!==r);Object.keys(state.repeatExceptions).filter(k=>k.startsWith(r.uid+'|')).forEach(k=>delete state.repeatExceptions[k]);save();render(true);};
 // Bulk delete only manually stored entries; generated repeat occurrences are untouched.
 const bulkDeleteDialog=()=>{
  const back=h('div','dialog-backdrop'),panel=h('div','dialog');
  panel.append(h('h2','','予定の一括削除'),h('p','','同じ名前の予定を検索します。繰り返し設定で自動表示される予定は削除しません。'));
  const field=h('input');field.type='text';field.placeholder='例：IIJmio';field.setAttribute('aria-label','削除する予定名');field.style.cssText='width:100%;padding:11px;border:1px solid #d9e0e8;border-radius:9px;font:inherit';panel.append(field);
  const scope=h('select');scope.style.cssText='width:100%;margin-top:10px;padding:11px;border:1px solid #d9e0e8;border-radius:9px;background:white;font:inherit';
  [['future','今日以降'],['all','すべての日付']].forEach(([v,t])=>{const opt=h('option','',t);opt.value=v;scope.append(opt)});panel.append(scope);
  const info=h('p','','予定名を入力してください。');panel.append(info);
  const actions=h('div','dialog-actions'),cancel=h('button','','キャンセル'),del=h('button','primary','削除する');del.style.background='#b94350';del.style.borderColor='#b94350';del.disabled=true;
  const findMatches=()=>{const name=field.value.trim(),min=iso(today());if(!name)return [];return Object.entries(state.schedule).filter(([date,value])=>(scope.value==='all'||date>=min)&&splitEvents(value).includes(name)).map(([date,value])=>({date,value}));};
  const refresh=()=>{const matches=findMatches();info.textContent=field.value.trim()?`削除対象：${matches.length}日分（保存済みの普通の予定のみ）`:'予定名を入力してください。';del.disabled=!matches.length};
  field.addEventListener('input',refresh);scope.addEventListener('change',refresh);
  cancel.onclick=()=>back.remove();del.onclick=()=>{const name=field.value.trim(),matches=findMatches();if(!name||!matches.length)return;back.remove();showDialog('一括削除の確認',`「${name}」を${matches.length}日分の保存済み予定から削除します。現在の繰り返し設定は変更しません。この操作は元に戻せません。`,[{label:'キャンセル'},{label:'削除する',primary:true,action:()=>{for(const {date} of matches){const parts=splitEvents(state.schedule[date]||'');const at=parts.indexOf(name);if(at>=0){parts.splice(at,1);if(parts.length)state.schedule[date]=parts.join('');else delete state.schedule[date];}}save();render(true);showDialog('削除完了',`${matches.length}日分の予定を削除しました。`,[{label:'閉じる',primary:true}]);}}]);};
  actions.append(cancel,del);panel.append(actions);back.append(panel);document.body.append(back);
 };
const setEditing=(el)=>{editing=true;active=el;el.dataset.editing='1';};
const finish=()=>{if(active)active.blur();editing=false;active=null;$('sheet').querySelectorAll('[data-editing]').forEach(e=>delete e.dataset.editing);render(false)};
const inputEvents=(el,opts={})=>{
 el.addEventListener('focus',()=>setEditing(el));
 el.addEventListener('blur',()=>{if(active===el){editing=false;active=null;}});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&el.tagName!=='TEXTAREA'){e.preventDefault();if(opts.onEnter)opts.onEnter();else finish()}});
};
const showDialog=(title,desc,buttons)=>{const back=h('div','dialog-backdrop'),box=h('div','dialog');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.append(h('h2','',title),h('p','',desc));const actions=h('div','dialog-actions');buttons.forEach(b=>{const btn=h('button',b.primary?'primary':'',b.label);btn.onclick=()=>{back.remove();b.action&&b.action()};actions.append(btn)});box.append(actions);back.append(box);document.body.append(back)};
const palette=[['赤','#B63838'],['橙','#C66A27'],['黄','#D9AE32'],['緑','#367B51'],['青','#3266A0'],['紺','#283F68'],['紫','#744A8E'],['グレー','#777777'],['ピンク','#E76F91'],['コーラル','#ED8065'],['明るい黄','#F1CA45'],['黄緑','#91B84E'],['水色','#4FAFD1'],['ターコイズ','#32B5A8'],['ラベンダー','#A285D1'],['えんじ','#963F58']];
const eventParts=text=>String(text||'').split(/[ \u3000]+/u).filter(Boolean);
const eventStyle=(id,index)=>{const stored=state.eventColors[id];if(!stored)return null;if(stored.bg)return index===0?stored:null;return stored[String(index)]||null};
const showColorDialog=id=>{
 const events=eventParts(scheduleValue(id));
 if(!events.length){showDialog('予定の色','先に予定を入力してください。',[{label:'閉じる'}]);return}
 const choose=index=>{
  const backdrop=h('div','dialog-backdrop'),panel=h('div','dialog');
  panel.append(h('h2','','予定の色'),h('p','',`「${events[index]}」の背景色と文字色を選んでください。`));

  const choices=h('div','color-text-choice');

  const none=h('button','color-swatch','色なし');none.dataset.color='';none.style.cssText='background:#fff;border:1px solid #b8c2cf;font-size:12px';none.onclick=()=>{bg='';refresh()};grid.append(none);
  palette.forEach(([name,hex])=>{const b=h('button','color-swatch',name);b.dataset.color=hex;b.style.background=hex;b.style.color=hex==='#D9AE32'?'#111':'#fff';b.onclick=()=>{bg=hex;refresh()};grid.append(b)});
  panel.append(grid,h('p','','文字色'));
  [['黒','#000000'],['白','#FFFFFF']].forEach(([name,hex])=>{const b=h('button','',name);b.dataset.color=hex;b.onclick=()=>{fg=hex;refresh()};choices.append(b)});
  panel.append(choices);
  const actions=h('div','dialog-actions'),cancel=h('button','','キャンセル'),apply=h('button','primary','決定');
  cancel.onclick=()=>backdrop.remove();
  apply.onclick=()=>{
   const old=state.eventColors[id]||{},styles=old.bg?{'0':old}:Object.assign({},old);
   if(bg)styles[String(index)]={bg,fg};else delete styles[String(index)];
   if(Object.keys(styles).length)state.eventColors[id]=styles;else delete state.eventColors[id];
   save();backdrop.remove();render(true)
  };
  actions.append(cancel,apply);panel.append(actions);backdrop.append(panel);document.body.append(backdrop);refresh();
 };
 if(events.length===1){choose(0);return}
 const backdrop=h('div','dialog-backdrop'),panel=h('div','dialog');
 panel.append(h('h2','','色を付ける予定を選択'),h('p','','スペースで区切った予定から選んでください。'));
 events.forEach((event,index)=>{const b=h('button','',event);b.style.cssText='display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border:1px solid #d9e0e8;border-radius:7px;background:#fff;color:#243247;font:inherit';b.onclick=()=>{backdrop.remove();choose(index)};panel.append(b)});
 const cancel=h('button','','キャンセル');cancel.onclick=()=>backdrop.remove();panel.append(cancel);backdrop.append(panel);document.body.append(backdrop);
};
const templateKey='planner-memo-templates-v1';
// Legacy text-only templates are migrated on read, without changing their stored text.
const loadTemplates=()=>{try{const a=JSON.parse(localStorage.getItem(templateKey));return Array.isArray(a)?a.map(x=>typeof x==='string'?{text:x,bg:'',fg:'#FFFFFF'}:x).filter(x=>x&&typeof x.text==='string').slice(0,10):[]}catch{return []}};
const showTemplateDialog=(input,selection,id)=>{
 const backdrop=h('div','dialog-backdrop'),panel=h('div','dialog');
 const heading=h('h2','','定型文（最大10件）'),hint=h('p','','文章と背景色・文字色を登録できます。選ぶとカーソル位置に挿入します。');
 const list=h('div','');panel.append(heading,hint,list);
 const persist=a=>localStorage.setItem(templateKey,JSON.stringify(a));
 const insert=item=>{
  const original=input.value,start=Math.min(selection.start,original.length),end=Math.min(selection.end,original.length);
  const before=original.slice(0,start),after=original.slice(end),text=item.text;
  const updated=before+text+after;
  // Preserve existing per-token colors when tokens are shifted by insertion.
  const tokenPositions=value=>{const a=[];const re=/[^ \u3000]+/gu;let m;while((m=re.exec(value)))a.push({start:m.index,end:m.index+m[0].length});return a};
  const oldTokens=tokenPositions(original),newTokens=tokenPositions(updated),shift=text.length-(end-start);
  const oldStyles=oldTokens.map((_,i)=>eventStyle(id,i));
  const newStyles={};
  newTokens.forEach((tok,i)=>{
   const inInserted=tok.start<start+text.length&&tok.end>start;
   if(inInserted&&item.bg){newStyles[String(i)]={bg:item.bg,fg:item.fg||'#FFFFFF'};return}
   const sourcePos=tok.start>=start+text.length?tok.start-shift:tok.start;
   const oldIndex=oldTokens.findIndex(t=>t.start<=sourcePos&&t.end>sourcePos&&(t.end<=start||t.start>=end));
   if(oldIndex>=0&&oldStyles[oldIndex]?.bg)newStyles[String(i)]={...oldStyles[oldIndex]};
  });
  if(Object.keys(newStyles).length)state.eventColors[id]=newStyles;else delete state.eventColors[id];
  // Persist the text and its color map together before repainting.
  // Re-render from state so the display chips and widget receive the same styles.
  state.schedule[id]=updated;
  save();
  backdrop.remove();
  render(true);
  const restored=[...document.querySelectorAll('.dayrow')].find(row=>row.querySelector('input')?.getAttribute('aria-label')===`${id}の予定`)?.querySelector('input');
  if(restored){restored.focus();const caret=start+text.length;restored.setSelectionRange(caret,caret)}
 };
 const edit=index=>{
  const a=loadTemplates(),old=index<0?{text:'',bg:'',fg:'#FFFFFF'}:a[index];
  const editPanel=h('div','dialog');editPanel.append(h('h2','',index<0?'定型文を登録':'定型文を編集'));
  const field=h('textarea','template-text');field.value=old.text;field.placeholder='登録する文章';editPanel.append(field);
  let bg=old.bg||'',fg=old.fg||'#FFFFFF';
  // If a selected schedule token already has a color, offer it as the initial style for a new template.
  if(index<0){
   const value=input.value;let from=selection.start,to=selection.end;
   if(from===to&&value.length){while(from>0&&!/[ \u3000]/u.test(value[from-1]))from--;while(to<value.length&&!/[ \u3000]/u.test(value[to]))to++}
   const selected=value.slice(from,to).trim();
   if(selected){field.value=selected;const tokens=eventParts(value.slice(0,from));const style=eventStyle(id,tokens.length);if(style?.bg){bg=style.bg;fg=style.fg||'#FFFFFF'}}
  }
  editPanel.append(h('p','','背景色'));
  const grid=h('div','color-palette'),choices=h('div','color-text-choice');
  const refresh=()=>{grid.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.color===bg));choices.querySelectorAll('button').forEach(b=>b.classList.toggle('primary',b.dataset.color===fg))};
  const none=h('button','color-swatch','色なし');none.dataset.color='';none.onclick=()=>{bg='';refresh()};grid.append(none);
  palette.forEach(([name,hex])=>{const b=h('button','color-swatch',name);b.dataset.color=hex;b.style.background=hex;b.style.color=['#D9AE32','#F1CA45','#91B84E'].includes(hex)?'#111':'#fff';b.onclick=()=>{bg=hex;refresh()};grid.append(b)});
  editPanel.append(grid,h('p','','文字色'));
  [['黒','#000000'],['白','#FFFFFF']].forEach(([name,hex])=>{const b=h('button','',name);b.dataset.color=hex;b.onclick=()=>{fg=hex;refresh()};choices.append(b)});editPanel.append(choices);
  const actions=h('div','dialog-actions'),cancel=h('button','','キャンセル'),apply=h('button','primary','保存');
  cancel.onclick=()=>{editPanel.replaceWith(panel)};
  apply.onclick=()=>{const cleaned=field.value.trim();if(!cleaned)return;if(index<0){if(a.length>=10)return;a.push({text:cleaned,bg,fg})}else a[index]={text:cleaned,bg,fg};persist(a);editPanel.replaceWith(panel);draw()};
  actions.append(cancel,apply);editPanel.append(actions);panel.replaceWith(editPanel);refresh();
 };
 const draw=()=>{list.replaceChildren();const a=loadTemplates();a.forEach((item,i)=>{const row=h('div','template-item'),use=h('button','',item.text),change=h('button','','編集'),del=h('button','','削除');if(item.bg){use.style.backgroundColor=item.bg;use.style.color=item.fg||'#FFFFFF'}use.onclick=()=>insert(item);change.onclick=()=>edit(i);del.onclick=()=>{if(!confirm('この定型文を削除しますか？'))return;const next=loadTemplates();next.splice(i,1);persist(next);draw()};row.append(use,change,del);list.append(row)});add.disabled=a.length>=10};
 const actions=h('div','template-actions'),add=h('button','primary','＋登録'),close=h('button','','閉じる');add.onclick=()=>edit(-1);close.onclick=()=>backdrop.remove();actions.append(add,close);panel.append(actions);backdrop.append(panel);document.body.append(backdrop);draw();
};
const tabs=()=>{const bar=$('tabs');bar.replaceChildren();state.order.forEach(name=>{const b=h('button','tab'+(name===current?' active':''),name);b.type='button';b.onclick=()=>switchTo(name);bar.append(b)})};
const switchTo=name=>{if(name===current)return;if(editing&&active)active.blur();editing=false;active=null;scrolls[current]=$('sheet').scrollTop;transitionDirection=state.order.indexOf(name)>state.order.indexOf(current)?1:-1;current=name;render(true)};
const render=restore=>{
 tabs();const sheet=$('sheet');sheet.replaceChildren();sheet.classList.remove('transition-in-left','transition-in-right');
 $('today').classList.add('hidden');
 if(current==='予定表'){
  const start=today(),end=new Date(start.getFullYear()+5,start.getMonth(),start.getDate());let d=new Date(start);
  let shownMonth='';
  while(d<=end){const id=iso(d),monthKey=`${d.getFullYear()}-${d.getMonth()}`;if(monthKey!==shownMonth){const mh=h('div','month-header',monthLabel(d));sheet.append(mh);shownMonth=monthKey}const row=h('div','dayrow'+(state.rest[id]?' rest':'')),date=h('div','date '+color(d),label(d)),entry=h('div','entry'),inp=h('input');
   date.title='タップで休みを切り替え';date.onclick=()=>{if(editing)return;state.rest[id]=!state.rest[id];save();row.classList.toggle('rest',!!state.rest[id])};
   inp.type='text';inp.value=scheduleValue(id);inp.setAttribute('aria-label',`${id}の予定`);
    const display=h('div','event-display');
    const paint=()=>{display.replaceChildren();const raw=scheduleValue(id),re=/[^ \u3000]+|[ \u3000]+/gu;let m,index=0;
      while((m=re.exec(raw))){const isSpace=/^[ \u3000]+$/u.test(m[0]);const span=h('span',isSpace?'event-plain':'event-plain',m[0]);if(!isSpace){const style=eventStyle(id,index++);if(style?.bg){span.className='event-chip';span.style.backgroundColor=style.bg;span.style.color=style.fg||'#FFFFFF'}}display.append(span)}
    };
    paint();
    inp.addEventListener('input',()=>{state.schedule[id]=inp.value;paint();save()});
    inputEvents(inp);
    const rep=h('button','color-button','🎨');rep.type='button';rep.setAttribute('aria-label','予定の色を設定');
    rep.addEventListener('pointerdown',e=>e.preventDefault());
    rep.onclick=()=>{if(active)active.blur();showColorDialog(id)};
    const template=h('button','template-button','🗒️');template.type='button';template.setAttribute('aria-label','定型文を挿入');
    let savedSelection={start:0,end:0};template.addEventListener('pointerdown',e=>{savedSelection={start:inp.selectionStart??inp.value.length,end:inp.selectionEnd??inp.value.length};e.preventDefault()});
    template.onclick=()=>showTemplateDialog(inp,savedSelection,id);
   entry.append(inp,display,rep,template);row.append(date,entry);sheet.append(row);d.setDate(d.getDate()+1);
  }
  sheet.onscroll=()=>{$('today').classList.toggle('hidden',editing||sheet.scrollTop<50)};
 }else if(current==='メモ'){
  const box=h('section','memo'),area=h('textarea');
  area.value=state.memo;area.placeholder='ここにメモを入力';area.setAttribute('aria-label','メモ');
  const resizeMemo=()=>{area.style.height='auto';area.style.height=Math.max(260,area.scrollHeight)+'px'};
  area.oninput=()=>{state.memo=area.value;save();resizeMemo()};inputEvents(area);
  box.append(area);sheet.append(box);resizeMemo();sheet.onscroll=null;

 }

 if(restore)sheet.scrollTop=scrolls[current]||0;else sheet.scrollTop=0;
 if(!restore){sheet.classList.add(transitionDirection>0?'transition-in-right':'transition-in-left')}
};
const backupNow=()=>{
 try{
  save();
  const data={format:'planner-backup',version:1,exportedAt:new Date().toISOString(),storageKey,data:JSON.parse(localStorage.getItem(storageKey))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  const d=new Date(),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  a.href=url;a.download=`予定表バックアップ_${stamp}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(err){showDialog('保存できませんでした','バックアップの作成に失敗しました。もう一度お試しください。',[{label:'閉じる',primary:true}])}
};
const validBackup=data=>{
 if(!data||typeof data!=='object'||Array.isArray(data))return false;
 if(data.format!=='planner-backup'||data.version!==1||data.storageKey!==storageKey)return false;
 const s=data.data;
 if(!s||typeof s!=='object'||Array.isArray(s))return false;
 if(!Array.isArray(s.order)||!s.order.every(x=>typeof x==='string'))return false;
 if(!s.schedule||typeof s.schedule!=='object'||Array.isArray(s.schedule))return false;
 if(typeof s.memo!=='string'||!s.rest||typeof s.rest!=='object'||Array.isArray(s.rest))return false;
 return true;
};
const restorePicker=$('restore-file');
restorePicker.addEventListener('change',async()=>{
 const file=restorePicker.files&&restorePicker.files[0];restorePicker.value='';if(!file)return;
 try{
  if(file.size>10*1024*1024)throw new Error('too large');
  const data=JSON.parse(await file.text());
  if(!validBackup(data))throw new Error('invalid format');
  const when=data.exportedAt?new Date(data.exportedAt).toLocaleString('ja-JP'):'日時不明';
  showDialog('バックアップから復元',`保存日時：${when}。現在の予定・メモ・設定などは、バックアップの内容に置き換わります。よろしいですか？`,[
   {label:'キャンセル'},
   {label:'復元する',primary:true,action:()=>{
    try{
     localStorage.setItem(storageKey,JSON.stringify(data.data));
     state=Object.assign({order:['予定表','メモ'],schedule:{},rest:{},memo:'',trash:[],repeats:[],repeatExceptions:{},eventColors:{}},data.data);
     state.repeatExceptions=state.repeatExceptions||{};state.eventColors=state.eventColors||{};state.order=['予定表','メモ'];
     if(active)active.blur();active=null;editing=false;current='予定表';scrolls={};save();render(false);
     showDialog('復元完了','バックアップのデータを復元しました。',[{label:'閉じる',primary:true}]);
    }catch(e){showDialog('復元できませんでした','データを保存できませんでした。',[{label:'閉じる',primary:true}])}
   }}]);
 }catch(err){showDialog('読み込めませんでした','この予定表で作成した有効なバックアップファイル（JSON）を選んでください。',[{label:'閉じる',primary:true}])}
});
$('menu').onclick=()=>{
 if(editing&&active)active.blur();editing=false;active=null;
 showDialog('メニュー','予定・メモなどのデータを保存・復元できます。',[
  {label:'バックアップを保存',action:backupNow},
  {label:'バックアップから復元',action:()=>restorePicker.click()},

 ]);
};
$('today').onclick=()=>{$('sheet').scrollTo({top:0,behavior:'smooth'})};
// 画面切り替えは上部タブのタップのみ。横スワイプは各項目の操作に使う。
save();render(false);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
